<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Advanced Web Week 4</title>
		<script src="form.js" defer></script>
	</head>
	<body>
		<form id="todoForm">
			<label for="userInput">Name </label>
			<input id="userInput" type="text" />
			<label for="todoInput">Todo </label>
			<input id="todoInput" type="text" />
			<button id="submit-data">Submit</button>
			<p id="todo_paragraph"></p>
		</form>
		<form id="searchForm">
			<label for="searchInput">Search username </label>
			<input id="searchInput" type="text" />
			<button id="search">Search</button>
			<p id="search_paragraph"></p>
		</form>
		<ul id="todo_list"></ul>
	</body>
</html>
